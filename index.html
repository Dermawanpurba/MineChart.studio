<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MineChart.studio · Grafik</title>
<style>
:root{--bg:#f8fafc;--card:#ffffff;--fg:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#f59e0b}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#111827;--fg:#e2e8f0;--mut:#94a3b8;--line:#243047}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px}
h1{font-size:18px;margin:0 0 10px;font-weight:650}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{background:var(--acc);color:#111827;border-color:var(--acc)}
input,select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;min-height:32px}
.chip:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card.wide{grid-column:1/-1}
.card h2{font-size:14px;margin:0 0 2px;font-weight:600;text-wrap:balance}
.meta{font-size:11px;color:var(--mut);margin:0 0 8px}
.count{font-size:12px;color:var(--mut);margin-left:auto}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg text{font-family:inherit}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;min-height:32px}
.btn:hover{border-color:var(--acc)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.empty-data{font-size:12px;color:var(--mut);margin:18px 0;text-align:center}
.lab{display:grid;gap:14px;min-width:0}
.body{min-width:0}
.panel{margin:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.panel summary{cursor:pointer;padding:9px 12px;font-size:12px;font-weight:600;list-style:none;min-height:36px;display:flex;align-items:center}
.panel summary::-webkit-details-marker{display:none}
.panel summary::before{content:"\25B8";margin-right:6px;color:var(--mut)}
.panel[open] summary::before{content:"\25BE"}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:0 12px 12px}
.fld{display:grid;gap:3px;font-size:12px}
.fld span{color:var(--mut)}
.fld input{width:100%}
.fs{grid-column:1/-1;border:1px solid var(--line);border-radius:8px;padding:8px;margin:0;display:grid;gap:8px;min-width:0}
.fs legend{font-size:12px;color:var(--mut);padding:0 4px}
.item{grid-column:1/-1;border-left:2px solid var(--line);padding-left:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.item .btn.sm{grid-column:1/-1}
.btn.sm{font-size:11px;min-height:28px;padding:3px 8px;justify-self:start}
.hint{font-size:11px;color:var(--mut)}
.gbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.empty{grid-column:1/-1;color:var(--mut);text-align:center;padding:40px}
table.grid{border-collapse:separate;border-spacing:3px;width:100%;font-size:12px}
table.grid td,table.grid th{text-align:center;padding:7px 4px;border-radius:4px;font-variant-numeric:tabular-nums;font-weight:500}
table.grid th{color:var(--mut);background:none}
.small{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.small b{display:block;font-size:12px;font-weight:600}
.small small{display:block;font-size:11px;color:var(--mut);margin-bottom:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tree{display:flex;gap:12px;align-items:stretch}
.tcol{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
.tnode{border:1px solid var(--line);border-radius:8px;padding:9px;font-size:12px;background:var(--bg)}
.tnode.root{border-color:var(--acc)}
.tnode small{display:block;color:var(--mut);margin-top:2px}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dl{font-size:12px;display:grid;gap:6px}
.dl span{display:flex;align-items:center;gap:6px}
.dl i{width:10px;height:10px;border-radius:2px;display:inline-block}
@media (max-width:420px){main{grid-template-columns:1fr;padding:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- helpers ---------- */
const PAL = ['#f59e0b','#06b6d4','#6366f1','#10b981','#ec4899','#8b5cf6','#f43f5e','#0ea5e9'];
const COL = {pos:'#10b981', neg:'#f43f5e', warn:'#f59e0b', info:'#3b82f6', base:'#94a3b8', total:'#64748b'};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const pctIn = s => { const m = String(s).match(/(\d+(?:[.,]\d+)?)%/); return m ? parseFloat(m[1].replace(',', '.')) : NaN; };

const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.size || 11}" text-anchor="${o.a || 'middle'}" style="fill:${o.fill || 'var(--mut)'}"${o.w ? ` font-weight="${o.w}"` : ''}${o.rot ? ` transform="rotate(${o.rot} ${x} ${y})"` : ''}>${esc(s)}</text>`;
const L = (x1, y1, x2, y2, o = {}) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${o.c || 'var(--line)'}" stroke-width="${o.w || 1}"${o.d ? ` stroke-dasharray="${o.d}"` : ''}/>`;
const SVG = (w, h, inner) => `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${inner}</svg>`;
const EMPTY_HTML = '<p class="empty-data">Isi data grafik ini untuk menampilkannya. Buka "Edit data".</p>';
// Safe entry point: empty or invalid data shows a message instead of a broken chart.
function renderSafe(ch) {

}
const cat = (i, n) => PL + (i + 0.5) * (PW / n);
const legend = items => `<div class="legend">${items.map(([c, l]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join('')}</div>`;
function nice(v) { if (!(v > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function yAxis(max, fmt = v => +v.toFixed(1)) {
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, y = PT + PH - (v / max) * PH; g += L(PL, y, W - PR, y) + T(PL - 6, y + 4, fmt(v), {a: 'end'}); }
  return { s: v => PT + PH - (v / max) * PH, g };
}

/* ---------- chart renderers (each returns HTML) ---------- */
function combo(c) {

    s += `<rect x="${x + 2}" y="${y.s(g.actual[i])}" width="${bw}" height="${PT + PH - y.s(g.actual[i])}" fill="#f59e0b" rx="2"/>`;
    s += T(x, H - 10, lb);

  const ry = v => PT + PH - (v / 100) * PH;
  s += `<polyline fill="none" stroke="#06b6d4" stroke-width="2" points="${g.rate.map((v, i) => cat(i, n) + ',' + ry(v)).join(' ')}"/>`;
  g.rate.forEach((v, i) => { s += `<circle cx="${cat(i, n)}" cy="${ry(v)}" r="3.5" fill="#06b6d4"/>` + T(cat(i, n), ry(v) - 8, v + '%', {fill: '#06b6d4'}); });
  return SVG(W, H, s) + legend([['#cbd5e1', 'Rencana (' + g.unit + ')'], ['#f59e0b', 'Aktual'], ['#06b6d4', 'Pencapaian (%)']]);
}
function waterfall(c) {
  const st = c.cfg.steps, n = st.length, y = v => PT + PH - (v / 100) * PH, bw = PW / n * 0.6;

  st.forEach((it, i) => {
    const x = cat(i, n), top = y(it.b + it.h), bot = y(it.b), col = COL[it.c] || COL.base;
    s += `<rect x="${x - bw / 2}" y="${top}" width="${bw}" height="${Math.max(1, bot - top)}" fill="${col}" rx="2"/>`;
    s += T(x, top - 6, it.v, {fill: 'var(--fg)', w: 600}) + T(x, H - 10, it.l);
  });
  return SVG(W, H, s) + legend([[COL.pos, 'Naik / hemat'], [COL.neg, 'Turun / tambah biaya'], [COL.total, 'Total']]);
}
function control(c) {
  const g = c.cfg, pts = g.pts.map(Number), n = pts.length;
  const mean = pf(g.mean), ucl = pf(g.ucl), lcl = pf(g.lcl);

  const lo = Math.min(lcl, ...pts) * 0.9, hi = Math.max(Math.max(ucl, ...pts) * 1.05, Math.min(lcl, ...pts) * 0.9 + 1);
  const y = v => PT + PH - ((v - lo) / (hi - lo)) * PH;
  let s = '';
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; s += L(PL, y(v), W - PR, y(v)) + T(PL - 6, y(v) + 4, +v.toFixed(1), {a: 'end'}); }
  s += L(PL, y(ucl), W - PR, y(ucl), {c: '#f43f5e', d: '4 3'}) + T(W - PR, y(ucl) - 4, 'UCL ' + g.ucl, {a: 'end', fill: '#f43f5e'});
  s += L(PL, y(lcl), W - PR, y(lcl), {c: '#f43f5e', d: '4 3'}) + T(W - PR, y(lcl) + 12, 'LCL ' + g.lcl, {a: 'end', fill: '#f43f5e'});
  s += L(PL, y(mean), W - PR, y(mean), {c: '#10b981'}) + T(PL + 4, y(mean) - 4, 'Mean ' + g.mean, {a: 'start', fill: '#10b981'});
  s += `<polyline fill="none" stroke="#6366f1" stroke-width="1.5" points="${pts.map((v, i) => cat(i, n) + ',' + y(v)).join(' ')}"/>`;
  pts.forEach((v, i) => { const oo = v > ucl || v < lcl; s += `<circle cx="${cat(i, n)}" cy="${y(v)}" r="${oo ? 5 : 3.5}" fill="${oo ? '#f43f5e' : '#6366f1'}"/>` + T(cat(i, n), H - 10, g.labels[i]); });
  return SVG(W, H, s) + legend([['#6366f1', 'Nilai'], ['#f43f5e', 'Di luar batas kendali']]);
}
function histogram(c) {
  const b = c.cfg.bins, k = c.cfg.counts, n = b.length, y = yAxis(nice(Math.max(...k) * 1.1), v => Math.round(v));
  let s = y.g; const bw = PW / n;
  k.forEach((v, i) => { const x = PL + i * bw + 3, w = bw - 6; s += `<rect x="${x}" y="${y.s(v)}" width="${w}" height="${PT + PH - y.s(v)}" fill="#f59e0b" rx="2"/>` + T(x + w / 2, y.s(v) - 4, v, {fill: 'var(--fg)'}) + T(x + w / 2, H - 10, b[i]); });
  return SVG(W, H, s);
}
function box(c) {
  const g = c.cfg, n = g.groups.length;
  const lo = g.q1.map((q, i) => Math.max(0, q - 1.5 * (g.q3[i] - q))), hi = g.q3.map((q, i) => q + 1.5 * (q - g.q1[i]));

    const x = cat(i, n);
    s += L(x, yy(lo[i]), x, yy(g.q1[i]), {c: '#64748b'}) + L(x, yy(g.q3[i]), x, yy(hi[i]), {c: '#64748b'});
    s += L(x - bw / 4, yy(lo[i]), x + bw / 4, yy(lo[i]), {c: '#64748b'}) + L(x - bw / 4, yy(hi[i]), x + bw / 4, yy(hi[i]), {c: '#64748b'});
    s += `<rect x="${x - bw / 2}" y="${yy(g.q3[i])}" width="${bw}" height="${yy(g.q1[i]) - yy(g.q3[i])}" fill="#06b6d4" fill-opacity=".35" stroke="#06b6d4"/>`;
    s += L(x - bw / 2, yy(g.med[i]), x + bw / 2, yy(g.med[i]), {c: '#f59e0b', w: 2.5});
    s += T(x, H - 10, lb) + T(x, yy(g.med[i]) - 7, g.med[i], {fill: 'var(--fg)'});
  });
  return SVG(W, H, s) + `<div class="meta">Satuan: ${esc(g.unit)} · kotak = Q1 sampai Q3 · garis tebal = median · whisker = 1,5 × IQR</div>`;

function small(c) {
  return `<div class="small">` + c.cfg.items.map(it => `<div><b>${esc(it.n)}</b><small>${esc(it.v)}</small><svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width:100%;height:64px;display:block"><polyline fill="none" stroke="#f59e0b" stroke-width="2" vector-effect="non-scaling-stroke" points="${it.pts}"/></svg></div>`).join('') + `</div>`;
}
function quad(c) {
  const g = c.cfg, x = v => PL + v / 100 * PW, y = v => PT + PH - v / 100 * PH;
  let s = L(x(50), PT, x(50), PT + PH, {c: 'var(--mut)', d: '3 3'}) + L(PL, y(50), W - PR, y(50), {c: 'var(--mut)', d: '3 3'});
  s += T(PL + 6, PT + 14, g.q2, {a: 'start'}) + T(W - PR - 6, PT + 14, g.q1, {a: 'end', fill: 'var(--fg)', w: 600});
  s += T(PL + 6, PT + PH - 6, g.q3, {a: 'start'}) + T(W - PR - 6, PT + PH - 6, g.q4, {a: 'end'});
  g.pts.forEach(p => { const col = COL[p.c] || COL.info; s += `<circle cx="${x(p.x)}" cy="${y(p.y)}" r="5.5" fill="${col}" fill-opacity=".85"/>` + T(x(p.x), y(p.y) - 9, p.n, {fill: 'var(--fg)'}); });

function cohort(c) {
  const g = c.cfg, rgb = g.mode === 'decay' ? '245,158,11' : '16,185,129';

  g.rows.forEach((r, i) => { h += `<tr><th style="text-align:left">${esc(r)}</th>` + g.data[i].map(v => { const a = Math.max(0.08, Math.min(1, v / 100)); return `<td style="background:rgba(${rgb},${a});color:${a > .55 ? '#111827' : 'var(--fg)'}">${v}%</td>`; }).join('') + `</tr>`; });

}
function tree(c) {
  const g = c.cfg, col = (items, cls) => `<div class="tcol">${items.map(it => `<div class="tnode ${cls}"><b>${esc(it.n)}</b><small>${esc(it.v)}</small></div>`).join('')}</div>`;

function forecast(c) {
  const h = c.cfg.hist, p = c.cfg.proj, all = [...h, ...p], n = all.length, y = yAxis(nice(Math.max(...all) * 1.1)), xs = i => PL + (i + 0.5) * PW / n;
  let s = y.g;

  s += `<polyline fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" points="${[h[h.length - 1], ...p].map((v, j) => xs(h.length - 1 + j) + ',' + y.s(v)).join(' ')}"/>`;
  all.forEach((v, i) => { const hist = i < h.length; s += `<circle cx="${xs(i)}" cy="${y.s(v)}" r="3.5" fill="${hist ? '#06b6d4' : '#f59e0b'}"/>` + T(xs(i), y.s(v) - 8, v, {fill: 'var(--fg)'}) + T(xs(i), H - 10, hist ? 'Hist ' + (i + 1) : 'Proy ' + (i - h.length + 1)); });

function slope(c) {
  const items = c.cfg.items, a1 = 190, a2 = W - 190, y = v => PT + 10 + v / 100 * (PH - 20);

function gauge(c) {
  const g = c.cfg, span = (g.max - g.min) || 1, f = (g.value - g.min) / span, tf = (g.target - g.min) / span;
  const cx = W / 2, cy = 175, R = 130, r = 98, rm = (R + r) / 2;

  for (let i = 0; i <= 4; i++) { const v = xm * i / 4; s += T(x(v), H - 10, +v.toFixed(1)); }
  g.points.forEach((p, i) => {
    const r = 6 + 22 * Math.sqrt(p.size / ms), col = PAL[i % PAL.length];
    s += `<circle cx="${x(p.x)}" cy="${y.s(p.y)}" r="${r.toFixed(1)}" fill="${col}" fill-opacity=".55" stroke="${col}"/>` + T(x(p.x), y.s(p.y) - r - 4, p.n, {fill: 'var(--fg)'});
  });
  return SVG(W, H, s) + `<div class="meta">X: ${esc(g.xLbl)} · Y: ${esc(g.yLbl)} · ukuran lingkaran: ${esc(g.sizeLbl || 'bobot')}</div>`;
}
function stackedArea(c) {
  const g = c.cfg, n = g.labels.length, ser = g.series;
  const tot = g.labels.map((_, i) => ser.reduce((a, s) => a + (s.values[i] || 0), 0));
  const mx = nice(Math.max(...tot) * 1.05), y = yAxis(mx, v => Math.round(v)), x = i => n < 2 ? PL + PW / 2 : PL + i / (n - 1) * PW;
  let base = g.labels.map(() => 0), s = y.g;
  ser.forEach((sr, k) => {
    const top = base.map((b, i) => b + (sr.values[i] || 0));
    const pts = top.map((v, i) => x(i) + ',' + y.s(v));
    for (let i = n - 1; i >= 0; i--) pts.push(x(i) + ',' + y.s(base[i]));
    s += `<polygon points="${pts.join(' ')}" fill="${PAL[k % PAL.length]}" fill-opacity=".7"/>`;
    base = top;
  });
  g.labels.forEach((lb, i) => { s += T(x(i), H - 10, lb); });
  return SVG(W, H, s) + legend(ser.map((sr, k) => [PAL[k % PAL.length], sr.n]));
}
function parallel(c) {
  const g = c.cfg, ax = g.axes, n = ax.length, xs = i => PL + 30 + i * (PW - 60) / (n - 1);
  const mx = ax.map((_, k) => nice(Math.max(...g.rows.map(r => r.values[k])) * 1.05));
  const y = (k, v) => PT + PH - v / mx[k] * PH;
  let s = '';
  ax.forEach((a, k) => { s += L(xs(k), PT, xs(k), PT + PH, {c: 'var(--mut)'}) + T(xs(k), H - 10, a); });
  g.rows.forEach((r, j) => {
    const col = PAL[j % PAL.length];
    s += `<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${r.values.map((v, k) => xs(k) + ',' + y(k, v)).join(' ')}"/>`;
    r.values.forEach((v, k) => { s += `<circle cx="${xs(k)}" cy="${y(k, v)}" r="3.5" fill="${col}"/>`; });
  });
  return SVG(W, H, s) + legend(g.rows.map((r, j) => [PAL[j % PAL.length], r.n]));
}
function candle(c) {
  const g = c.cfg, n = g.labels.length, lo = Math.min(...g.low) * 0.98, hi = Math.max(...g.high) * 1.02;
  const yv = v => PT + PH - ((v - lo) / ((hi - lo) || 1)) * PH;
  let s = '';
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; s += L(PL, yv(v), W - PR, yv(v)) + T(PL - 6, yv(v) + 4, Math.round(v).toLocaleString('id-ID'), {a: 'end'}); }
  const bw = PW / n * 0.5;
  g.labels.forEach((lb, i) => {
    const x = cat(i, n), o = g.open[i], cl = g.close[i], up = cl >= o, col = up ? '#10b981' : '#f43f5e';
    s += L(x, yv(g.high[i]), x, yv(g.low[i]), {c: col, w: 1.5});
    s += `<rect x="${x - bw / 2}" y="${yv(Math.max(o, cl))}" width="${bw}" height="${Math.max(1, Math.abs(yv(o) - yv(cl)))}" fill="${col}"/>`;
    s += T(x, H - 10, lb);
  });
  return SVG(W, H, s) + legend([['#10b981', 'Naik (close ≥ open)'], ['#f43f5e', 'Turun'], ['var(--mut)', g.unit || '']]);
}

const RENDER = {
  'Combo Chart': combo, 'Waterfall Chart': waterfall, 'Control Chart': control, 'Histogram': histogram,
  'Box Plot': box, 'Small Multiples': small, 'Quadrant Chart': quad, 'Cohort Chart': cohort,
  'Decomposition Tree': tree, 'Forecast Chart': forecast, 'Slope Chart': slope, 'Gauge Chart': gauge,
  'Sankey Diagram': sankey, 'Funnel Chart': funnel, 'Treemap': treemap, 'Radar Chart': radar,
  'Heatmap': heat, 'Ordered Bar Chart': ordered, 'Bullet Chart': bullet, 'Scatter Plot': scatter,
  'Reliability Curve': reliab, 'Pareto Chart': pareto, 'Gantt Chart': gantt, 'Donut Chart': donut,
  '100% Stacked Bar': stacked100, 'Aging Chart': aging, 'Stock Projection Chart': stock, 'GIS Map': gis,
  'Lollipop Chart': lollipop, 'Dumbbell Chart': dumbbell, 'Bubble Chart': bubble, 'Stacked Area Chart': stackedArea, 'Parallel Coordinates': parallel, 'Candlestick Chart': candle
};
const WIDE = new Set(['Sankey Diagram', 'Gantt Chart', 'Decomposition Tree', 'Cohort Chart', 'Heatmap']);

/* ---------- code export ---------- */
// Self-contained markup: wraps the chart in a box that defines the CSS variables it uses.
function chartMarkup(ch) {
  return `<div style="--fg:#0f172a;--mut:#64748b;--line:#e2e8f0;font-family:system-ui,sans-serif">${RENDER[ch.type](ch)}</div>`;
}
// Source of the renderer function. It calls shared helpers (T, L, SVG, yAxis, ...) from this file, so include charts.js.
function chartSource(type) {
  return RENDER[type].toString();
}

/* ---------- app ---------- */
const STORE_KEY = 'minechart-data-v1';
const clone = o => JSON.parse(JSON.stringify(o));
const ORIGINAL = DATA.flatMap(d => d.charts);
let ALL = ORIGINAL.map((c, idx) => ({idx, title: c.title, type: c.type, cfg: clone(c.cfg), orig: clone(c.cfg)}));

function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(ALL.map(c => ({type: c.type, cfg: c.cfg})))); } catch (e) {} }
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (Array.isArray(s)) s.forEach((item, i) => { if (ALL[i] && item && item.type === ALL[i].type && item.cfg && typeof item.cfg === 'object') ALL[i].cfg = item.cfg; });
  } catch (e) {}
}
const getIn = (o, p) => p.reduce((a, k) => (a == null ? undefined : a[k]), o);
const setIn = (o, p, v) => { getIn(o, p.slice(0, -1))[p[p.length - 1]] = v; };
function blankLike(v) {
  if (Array.isArray(v)) return [];
  if (typeof v === 'number') return 0;
  if (typeof v === 'string') return '';
  if (v && typeof v === 'object') { const o = {}; for (const k in v) o[k] = blankLike(v[k]); return o; }
  return v;
}

/* form generated from the chart's config: every field the chart reads is editable */
function formHTML(obj, path, orig) {
  return Object.keys(obj).map(k => fieldHTML(obj[k], [...path, k], k, orig)).join('');
}
function fieldHTML(v, path, label, orig) {
  const pa = esc(JSON.stringify(path));
  if (Array.isArray(v)) {
    const sample = v.length ? v[0] : (getIn(orig, path) || [])[0];
    if (sample && typeof sample === 'object') {
      return `<fieldset class="fs"><legend>${esc(label)}</legend>` +
        v.map((it, i) => `<div class="item">${formHTML(it, [...path, i], orig)}<button type="button" class="btn sm" data-act="del" data-path="${pa}" data-i="${i}">Hapus baris</button></div>`).join('') +
        `<button type="button" class="btn sm" data-act="add" data-path="${pa}">Tambah baris</button></fieldset>`;
    }
    const numeric = typeof sample === 'number';
    return `<label class="fld"><span>${esc(label)} <em class="hint">(pisahkan dengan titik koma ;)</em></span><input type="text" data-path="${pa}" data-kind="list" data-num="${numeric ? 1 : 0}" value="${esc(v.join('; '))}"></label>`;
  }
  if (v && typeof v === 'object') return `<fieldset class="fs"><legend>${esc(label)}</legend>${formHTML(v, path, orig)}</fieldset>`;
  if (typeof v === 'number') return `<label class="fld"><span>${esc(label)}</span><input type="number" step="any" data-path="${pa}" data-kind="num" value="${v}"></label>`;
  return `<label class="fld"><span>${esc(label)}</span><input type="text" data-path="${pa}" data-kind="text" value="${esc(v ?? '')}"></label>`;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); return ok;
  }
}
function renderCard(ch) {
  return `<article class="card${WIDE.has(ch.type) ? ' wide' : ''}" data-k="${ch.idx}"><h2>${esc(ch.title)}</h2><div class="meta">${esc(ch.type)}</div>` +
    `<div class="lab"><div class="body">${renderSafe(ch)}</div>` +
    `<details class="panel" open><summary>Input angka (uji)</summary><div class="pgrid">${formHTML(ch.cfg, [], ch.orig)}</div></details></div>` +
    `<div class="actions">` +
    `<button type="button" class="btn" data-copy="markup" data-k="${ch.idx}">Salin SVG/HTML</button>` +
    `<button type="button" class="btn" data-copy="source" data-k="${ch.idx}">Salin kode fungsi</button>` +
    `<button type="button" class="btn" data-act="reset">Reset</button></div>` +
    `</article>`;
}
const cardEl = ch => document.querySelector(`article[data-k="${ch.idx}"]`);
function refreshBody(ch) { const b = cardEl(ch)?.querySelector('.body'); if (b) b.innerHTML = renderSafe(ch); }
function refreshPanel(ch) { const p = cardEl(ch)?.querySelector('.pgrid'); if (p) p.innerHTML = formHTML(ch.cfg, [], ch.orig); }

const state = {q: '', type: 'all'};
function render() {
  const q = state.q.trim().toLowerCase();
  const list = ALL.filter(ch => (state.type === 'all' || ch.type === state.type) && (!q || ch.title.toLowerCase().includes(q)));
  document.getElementById('grid').innerHTML = list.length ? list.map(renderCard).join('') : '<p class="empty">Tidak ada grafik yang cocok dengan filter.</p>';
  document.getElementById('count').textContent = list.length + ' dari ' + ALL.length + ' grafik';
}
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: 'application/json'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function init() {
  loadStore();
  const ts = document.getElementById('t');
  ts.innerHTML = '<option value="all">Semua jenis grafik</option>' + [...new Set(ALL.map(c => c.type))].sort().map(t => `<option>${esc(t)}</option>`).join('');
  ts.onchange = () => { state.type = ts.value; render(); };
  document.getElementById('q').oninput = e => { state.q = e.target.value; render(); };

  document.getElementById('grid').addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (!b) return;
    const card = b.closest('article[data-k]');
    const ch = card ? ALL[+card.dataset.k] : null;
    if (b.dataset.copy) {
      const text = b.dataset.copy === 'markup' ? chartMarkup(ch) : chartSource(ch.type);
      const label = b.textContent, ok = await copyText(text);
      b.textContent = ok ? 'Tersalin' : 'Gagal menyalin';
      setTimeout(() => { b.textContent = label; }, 1500);
      return;
    }
    if (b.dataset.act === 'add') {
      const p = JSON.parse(b.dataset.path), arr = getIn(ch.cfg, p);
      const tpl = arr.length ? arr[0] : (getIn(ch.orig, p) || [])[0];
      arr.push(tpl ? blankLike(tpl) : {});
      refreshPanel(ch); refreshBody(ch); saveStore();
    } else if (b.dataset.act === 'del') {
      const p = JSON.parse(b.dataset.path), arr = getIn(ch.cfg, p);
      arr.splice(+b.dataset.i, 1);
      refreshPanel(ch); refreshBody(ch); saveStore();
    } else if (b.dataset.act === 'reset') {
      ch.cfg = clone(ch.orig); refreshPanel(ch); refreshBody(ch); saveStore();
    }
  });
  document.getElementById('grid').addEventListener('input', e => {
    const el = e.target.closest('[data-path]');
    if (!el) return;
    const card = el.closest('article[data-k]'), ch = ALL[+card.dataset.k], p = JSON.parse(el.dataset.path);
    let v;
    if (el.dataset.kind === 'num') v = el.value === '' ? 0 : Number(el.value);
    else if (el.dataset.kind === 'list') {
      const parts = el.value.split(';').map(s => s.trim()).filter(s => s !== '');
      v = el.dataset.num === '1' ? parts.map(s => Number(s.replace(',', '.')) || 0) : parts;
    } else v = el.value;
    setIn(ch.cfg, p, v);
    refreshBody(ch); saveStore();
  });

  // global data tools
  document.getElementById('exp').onclick = () => download('minechart-data.json', JSON.stringify(ALL.map(c => ({title: c.title, type: c.type, cfg: c.cfg})), null, 2));
  document.getElementById('imp').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const arr = JSON.parse(await f.text());
      if (!Array.isArray(arr)) throw new Error('format');
      arr.forEach((item, i) => { if (ALL[i] && item && item.type === ALL[i].type && item.cfg && typeof item.cfg === 'object') ALL[i].cfg = item.cfg; });
      saveStore(); render();
    } catch (err) { alert('File data tidak valid. Pakai file JSON yang diunduh dari halaman ini.'); }
    e.target.value = '';
  };
  document.getElementById('resetall').onclick = () => {
    if (!confirm('Kembalikan semua grafik ke data awal?')) return;
    ALL.forEach(c => { c.cfg = clone(c.orig); }); saveStore(); render();
  };
  render();
}
if (typeof document !== 'undefined') init();
</script>
</body>
